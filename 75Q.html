            let html = '';
            filtered.forEach((q, index) => {
                const qHighlight = highlightText(q.question, query);
                const aHighlight = highlightText(q.answer, query);
                const tagHtml = q.tags.map(t => `<span>${highlightText(t, query)}</span>`).join('');
                const catLabel = {
                    'latar': 'Latar Belakang',
                    'metode': 'Metode & Teknis',
                    'pengujian': 'Pengujian & Evaluasi',
                    'hasil': 'Hasil & Kesimpulan',
                    'kritis': 'Argumen Kritis',
                    'pengembangan': 'Pengembangan'
                } [q.category] || q.category;

                html += `
                    <div class="card">
                        <div class="q">
                            <span class="num">#${q.id}</span>
                            <span>${qHighlight}</span>
                        </div>
                        <div class="a">${aHighlight}</div>
                        <div class="tags">
                            <span class="cat">${catLabel}</span>
                            ${tagHtml}
                        </div>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }

        searchInput.addEventListener('input', () => {
            currentQuery = searchInput.value;
            render();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        render();
    </script>

</body>
</html>
